<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leinotek</title>
<meta name="description" content="Apps by Leinotek Co., Ltd.">
<style>
  :root { --bg:#F7F4EE; --card:#FFFFFF; --ink:#2E2A26; --soft:#7B746C; --line:#E6E0D6; --accent:#CF8A52; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1E1B18; --card:#29251F; --ink:#F1ECE4; --soft:#B3AA9E; --line:#3A342D; --accent:#E0A06B; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; line-height:1.7; }
  .wrap { max-width:720px; margin:0 auto; padding:64px 20px 40px; }
  h1 { font-size:34px; letter-spacing:.06em; margin:0; }
  .sub { color:var(--soft); margin:4px 0 40px; }
  h2 { font-size:14px; letter-spacing:.12em; color:var(--soft); font-weight:600; margin:0 0 14px; }
  .app { display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; }
  .app:hover { border-color:var(--accent); }
  .app img { width:64px; height:64px; border-radius:15px; flex:none; background:var(--line); }
  .app strong { display:block; font-size:18px; }
  .app span { color:var(--soft); font-size:14px; }
  .arrow { margin-left:auto; color:var(--soft); }
  footer { margin-top:56px; color:var(--soft); font-size:14px; }
  footer a { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Leinotek</h1>
  <p class="sub">Small apps for everyday life.</p>

  <h2>APPS</h2>
  <a class="app" href="linger-diary/">
    <img src="linger-diary/images/icon.png" alt="">
    <div>
      <strong>徊留 Linger Diary</strong>
      <span>停下來，記住這一刻 · Pause and keep this moment</span>
    </div>
    <span class="arrow">›</span>
  </a>

  <footer>
    <div>Contact: <a href="mailto:lingerdiary.support@gmail.com">lingerdiary.support@gmail.com</a></div>
    <div>© 2026 Leinotek Co., Ltd.</div>
  </footer>
</div>
</body>
</html>
